<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/popup.css">
    <link rel="stylesheet" href="options.css">
    <title>WebDAV 云端备份</title>
  </head>
  
<body class="bg-light">

    <script src="header.js"></script>

<div id="pageapp" class="container">

    <div class="page_mod fade">
        <div class="card">
            <div class="card-body">
                <h5>WebDAV 云端备份</h5>
                <p class="text-muted small">将设置（搜索引擎、自定义样式等）上传/下载到坚果云、Nextcloud、群晖等 WebDAV 存储。账号密码仅保存在本机浏览器存储。</p>

                <div class="form-group">
                    <label for="davPreset">选择云服务商</label>
                    <select class="custom-select" id="davPreset">
                        <option value="custom">自定义</option>
                        <option value="jianguoyun">坚果云</option>
                        <option value="synology">群晖（Synology）</option>
                        <option value="nextcloud">Nextcloud / ownCloud</option>
                        <option value="aliyundrive">阿里云盘（WebDAV）</option>
                        <option value="123pan">123 云盘（WebDAV）</option>
                        <option value="teracloud">TeraCloud（日本）</option>
                        <option value="box">Box.com</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="davUrl">服务器地址</label>
                    <input type="url" class="form-control" id="davUrl" autocomplete="off" spellcheck="false" placeholder="https://dav.jianguoyun.com/dav/">
                </div>

                <div class="form-group">
                    <label for="davPath">目录路径 <span class="small text-muted">（可选，如 /popup-search/）</span></label>
                    <input type="text" class="form-control" id="davPath" autocomplete="off" spellcheck="false">
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="davUser">用户名</label>
                        <input type="text" class="form-control" id="davUser" autocomplete="username" spellcheck="false" placeholder="可选">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="davPass">密码 / 应用密码</label>
                        <input type="password" class="form-control" id="davPass" autocomplete="current-password" placeholder="可选">
                    </div>
                </div>
                <div class="form-group">
                    <label for="davFile">文件名</label>
                    <input type="text" class="form-control" id="davFile" autocomplete="off" spellcheck="false" value="popup-search-config.json" disabled>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-primary" id="davSave">保存设置</button>
                    <button type="button" class="btn btn-outline-secondary" id="davTest">测试连接</button>
                    <button type="button" class="btn btn-success" id="davUpload">上传备份</button>
                    <button type="button" class="btn btn-warning" id="davDownload">从云端恢复</button>
                </div>

                <div class="mt-3">
                    <div id="davStatus" class="small text-muted"></div>
                </div>
            </div>
        </div>
    </div>

</div>

    <script src="footer.js" id="footer-js" page-js-files="webdav.js"></script>
  
  </body>
</html>
